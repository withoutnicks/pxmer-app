[package]
name = "pxmer"
version = "1.0.0"
description = "Temporizador Pomodoro con estética oscura de terminal"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "pxmer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
